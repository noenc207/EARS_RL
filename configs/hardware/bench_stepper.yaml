# EARS-RL Physical Stepper Hardware Bench Configuration
# WARNING: Physical hardware configuration.
# Limits MUST be physically verified before setting hardware_enabled: true.

experiment_id: "bench_stepper_001"
description: "Physical single-axis hybrid stepper bench test (ESP32-S3 + TMC2209)"

safety:
  hardware_enabled: false  # MUST remain false until bench limits and E-stop are verified
  motion_enabled_on_startup: false
  watchdog_timeout_ms: 500.0
  require_limits_verified: true
  max_position_error_rad: 0.35

data:
  data_dir: "./datasets"
  experiments_dir: "./experiments"
  checkpoints_dir: "./checkpoints"
  reports_dir: "./reports"
  log_format: "csv"
  buffer_size: 100
  flush_interval_s: 1.0

actuators:
  - joint_id: "stepper_joint_0"
    actuator_type: "stepper"
    position_min_rad: null  # Unverified - measure mechanical hard stops
    position_max_rad: null  # Unverified - measure mechanical hard stops
    velocity_max_rad_s: null  # Unverified - characterization required
    acceleration_max_rad_s2: null  # Unverified
    steps_per_revolution: 200
    microstep_resolution: 16
    gear_ratio: 1.0
    limits_verified: false
    enabled: false

encoders:
  - encoder_id: "stepper_joint_0_enc"
    encoder_type: "joint_encoder"
    resolution_counts_per_rev: null
    joint_id: "stepper_joint_0"

communication:
  serial_port: null  # e.g. "COM3" on Windows or "/dev/ttyUSB0" on Linux
  baudrate: 921600
  timeout_ms: 100.0

software_version: "0.1.0"
tags:
  - "hardware"
  - "unverified_limits"
  - "real_hardware"
notes: "Template for physical test rig. All limits require physical calibration."
